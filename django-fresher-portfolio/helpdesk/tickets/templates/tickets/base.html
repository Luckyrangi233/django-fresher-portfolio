<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}HelpDesk{% endblock %}</title>
<style>
body{margin:0;background:#f2f5f7;color:#172a35;font:16px/1.55 system-ui,sans-serif}header{background:#102a36;color:white;padding:1rem max(1rem,calc((100% - 850px)/2));display:flex;justify-content:space-between;gap:1rem;align-items:center}header a{color:white}main{max-width:850px;margin:2rem auto;padding:0 1rem}a{color:#075f65}h1{line-height:1.2}.card{background:white;border:1px solid #d9e2e5;border-radius:12px;padding:1rem 1.2rem;margin:1rem 0}.row{display:flex;justify-content:space-between;gap:1rem;align-items:center}.muted{color:#526873}label{display:block;font-weight:650;margin-top:1rem}input,textarea,select{width:100%;box-sizing:border-box;padding:.7rem;border:1px solid #9aabb1;border-radius:7px;font:inherit}button,.button{display:inline-block;background:#087b72;color:white;border:0;border-radius:7px;padding:.65rem 1rem;font:inherit;text-decoration:none;cursor:pointer}.errorlist{color:#a22}form.inline{display:inline}footer{max-width:850px;margin:3rem auto;padding:0 1rem;color:#526873}@media(max-width:560px){.row{align-items:flex-start;flex-direction:column}header{padding:1rem}}
</style></head>
<body><header><strong>HelpDesk / Team requests</strong><nav>{% if user.is_authenticated %}<span>{{ user.username }}</span> · <form class="inline" method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Sign out</button></form>{% else %}<a href="{% url 'login' %}">Sign in</a>{% endif %}</nav></header>
<main>{% block content %}{% endblock %}</main><footer>Learning project · Do not enter real customer or sensitive information.</footer></body></html>
